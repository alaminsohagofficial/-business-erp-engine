<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SALSABILAH AMIN LIMITED - Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-[#1a1625] text-white font-sans flex">
    <!-- Sidebar -->
    <div class="w-64 bg-[#231d30] h-screen p-5 flex flex-col gap-4 border-r border-gray-800">
        <h2 class="text-rose-500 font-bold text-lg border-b border-gray-700 pb-3">SALSABILAH AMIN LTD.</h2>
        <nav class="flex flex-col gap-2 text-sm text-gray-300">
            <a href="#" class="bg-rose-600 text-white p-2 rounded">🏠 Home</a>
            <a href="#" class="p-2 hover:bg-gray-700 rounded">👥 User Management</a>
            <a href="#" class="p-2 hover:bg-gray-700 rounded">📞 Contacts</a>
            <a href="#" class="p-2 hover:bg-gray-700 rounded">📦 Products</a>
            <a href="#" class="p-2 hover:bg-gray-700 rounded">🛒 Purchases</a>
            <a href="#" class="p-2 hover:bg-gray-700 rounded">💰 Sell</a>
            <a href="#" class="p-2 hover:bg-gray-700 rounded">📊 Reports</a>
        </nav>
    </div>
    <!-- Main Content -->
    <div class="flex-1 p-8">
        <div class="flex justify-between items-center mb-6 bg-[#231d30] p-4 rounded-lg border border-gray-800">
            <h1 class="text-xl font-semibold">Welcome AL AMIN</h1>
            <span class="bg-amber-600 text-xs px-3 py-1 rounded-full">Subscription Remaining: 15 Days</span>
        </div>
        <!-- Stats -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-8">
            <div class="bg-[#231d30] p-5 rounded-lg border-l-4 border-rose-500 shadow-lg">
                <p class="text-gray-400 text-xs uppercase">Total Sales</p>
                <h3 class="text-2xl font-bold mt-1">৳ 0.00</h3>
            </div>
            <div class="bg-[#231d30] p-5 rounded-lg border-l-4 border-blue-500 shadow-lg">
                <p class="text-gray-400 text-xs uppercase">Net Profit</p>
                <h3 class="text-2xl font-bold mt-1">৳ 0.00</h3>
            </div>
            <div class="bg-[#231d30] p-5 rounded-lg border-l-4 border-purple-500 shadow-lg">
                <p class="text-gray-400 text-xs uppercase">Total Purchase</p>
                <h3 class="text-2xl font-bold mt-1">৳ 0.00</h3>
            </div>
            <div class="bg-[#231d30] p-5 rounded-lg border-l-4 border-amber-500 shadow-lg">
                <p class="text-gray-400 text-xs uppercase">Total Expense</p>
                <h3 class="text-2xl font-bold mt-1">৳ 0.00</h3>
            </div>
        </div>
    </div>
</body>
</html>
