<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transaction Receipt</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .receipt-card {
            background: #ffffff;
            width: 100%;
            max-width: 380px;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            border: 1px solid #e0e0e0;
        }
        .header {
            text-align: center;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 15px;
            margin-bottom: 15px;
        }
        .header h2 {
            margin: 0;
            color: #1a365d;
            font-size: 20px;
        }
        .header p {
            margin: 5px 0 0;
            color: #718096;
            font-size: 13px;
        }
        .section-title {
            font-weight: bold;
            color: #2d3748;
            font-size: 14px;
            margin-top: 15px;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 13px;
        }
        .label {
            color: #718096;
        }
        .value {
            color: #1a202c;
            font-weight: 600;
            text-align: right;
        }
        .divider {
            height: 1px;
            background-color: #edf2f7;
            margin: 12px 0;
        }
        .amount-box {
            background-color: #e2e8f0;
            padding: 12px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
        }
        .amount-label {
            font-weight: bold;
            color: #2d3748;
        }
        .amount-value {
            font-size: 18px;
            font-weight: bold;
            color: #1a365d;
        }
        .status-badge {
            text-align: center;
            background-color: #c6f6d5;
            color: #22543d;
            font-size: 12px;
            font-weight: bold;
            padding: 4px 8px;
            border-radius: 4px;
            display: inline-block;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="receipt-card">
    <div class="header">
        <h2>Digital Bank</h2>
        <p>Transaction Receipt</p>
        <span class="status-badge">SUCCESSFUL</span>
    </div>

    <div class="section-title">Receiver Details</div>
    <div class="row">
        <span class="label">Name:</span>
        <span class="value">Supoth</span>
    </div>
    <div class="row">
        <span class="label">Bank:</span>
        <span class="value">Pubali Bank Ltd.</span>
    </div>
    <div class="row">
        <span class="label">Account No:</span>
        <span class="value">4390901017966</span>
    </div>

    <div class="divider"></div>

    <div class="section-title">Payment Info</div>
    <div class="row">
        <span class="label">Transaction ID:</span>
        <span class="value">LID02034113385</span>
    </div>
    <div class="row">
        <span class="label">Date & Time:</span>
        <span class="value">26-Jul-2026 08:37 PM</span>
    </div>

    <div class="amount-box">
        <span class="amount-label">Amount</span>
        <span class="amount-value">৳ 1,000.00</span>
    </div>
</div>

</body>
</html>
