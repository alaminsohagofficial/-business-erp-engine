services:
  # ১. Node.js Express Backend & Treasury API Server
  - type: web
    name: salsabilah-erp-backend
    env: node
    region: singapore
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: MONGO_URI
        sync: false # Render Dashboard-এ সেট করতে হবে

  # ২. Python Worker & API Sync Engine (Background Cron Worker)
  - type: worker
    name: salsabilah-python-worker
    env: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python worker.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11
      - key: LEDGER_API_URL
        value: https://salsabilah-erp-backend.onrender.com/api/v1/sync/ledger
      - key: GEMINI_API_KEY
        sync: false
      - key: BANK_API_ENDPOINT
        sync: false
      - key: BANK_API_TOKEN
        sync: false
      - key: API_TOKEN
        sync: false
