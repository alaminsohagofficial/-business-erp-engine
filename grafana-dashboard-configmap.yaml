apiVersion: v1
kind: ConfigMap
metadata:
  name: erp-engine-grafana-dashboard
  namespace: erp-engine
  labels:
    grafana_dashboard: "1"
data:
  erp-engine-dashboard.json: |-
    {
      "annotations": { "list": [] },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "title": "Salsabilah Amin Group - ERP Engine Dashboard",
      "uid": "erp-engine-prod-v1",
      "refresh": "5s",
      "schemaVersion": 38,
      "style": "dark",
      "tags": ["erp", "fastapi", "production"],
      "time": { "from": "now-1h", "to": "now" },
      "panels": [
        {
          "id": 1,
          "title": "Request Rate (QPS)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 8, "x": 0, "y": 0 },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
              "expr": "sum(rate(http_requests_total{namespace=\"erp-engine\"}[1m])) by (handler)",
              "legendFormat": "{{handler}}"
            }
          ]
        },
        {
          "id": 2,
          "title": "p95 Latency (Seconds)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 8, "x": 8, "y": 0 },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
              "expr": "histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{namespace=\"erp-engine\"}[5m])) by (le, handler))",
              "legendFormat": "{{handler}} (p95)"
            }
          ]
        },
        {
          "id": 3,
          "title": "5xx Error Count",
          "type": "stat",
          "gridPos": { "h": 8, "w": 8, "x": 16, "y": 0 },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
              "expr": "sum(increase(http_requests_total{status=~\"5..\", namespace=\"erp-engine\"}[5m]))",
              "legendFormat": "5xx Errors"
            }
          ]
        },
        {
          "id": 4,
          "title": "Container Memory Usage (MiB)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
              "expr": "container_memory_working_set_bytes{namespace=\"erp-engine\", container=\"erp-engine\"} / 1024 / 1024",
              "legendFormat": "{{pod}}"
            }
          ]
        },
        {
          "id": 5,
          "title": "Container CPU Usage (Cores)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
              "expr": "sum(rate(container_cpu_usage_seconds_total{namespace=\"erp-engine\", container=\"erp-engine\"}[5m])) by (pod)",
              "legendFormat": "{{pod}}"
            }
          ]
        }
      ]
    }
