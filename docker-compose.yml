services:
  # 1. PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: erp-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-erp_engine}
      POSTGRES_USER: ${DB_USER:-admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    networks:
      - erp-network

  # 2. Python ERP Engine & API (FastAPI/Flask)
  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    container_name: erp-backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${DB_USER:-admin}:${DB_PASSWORD:-secret}@db:5432/${DB_NAME:-erp_engine}
    depends_on:
      - db
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    networks:
      - erp-network

  # 3. Asynchronous Sync Service (Worker / Dispatch)
  sync-worker:
    build:
      context: .
      dockerfile: ./services/Dockerfile
    container_name: erp-sync-worker
    restart: unless-stopped
    env_file: .env
    command: ["node", "dispatchSyncEngine.js"] # or: ["python", "api_sync_engine.py"]
    depends_on:
      - db
      - backend
    networks:
      - erp-network

  # 4. Frontend Dashboard (React / Vite)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: erp-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - erp-network

networks:
  erp-network:
    driver: bridge

volumes:
  pgdata:
    driver: local
