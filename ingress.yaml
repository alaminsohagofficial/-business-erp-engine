apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: erp-engine-ingress
  namespace: erp-engine
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "25m" # Accommodates large DBBL EFT Excel/CSV batch uploads
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - erp.salsabilahamin.com
      secretName: erp-engine-tls-secret
  rules:
    - host: erp.salsabilahamin.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: erp-engine-service
                port:
                  number: 8000
