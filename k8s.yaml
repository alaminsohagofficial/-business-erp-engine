apiVersion: v1
kind: Namespace
metadata:
  name: erp-engine
---
apiVersion: v1
kind: Secret
metadata:
  name: erp-secrets
  namespace: erp-engine
type: Opaque
stringData:
  DATABASE_URL: "postgresql+asyncpg://erp_user:erp_password@postgres-service:5432/erp_db"
  REDIS_URL: "redis://redis-service:6379/0"
  GEMINI_API_KEY: "YOUR_GEMINI_API_KEY_HERE"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: erp-engine-deployment
  namespace: erp-engine
  labels:
    app.kubernetes.io/name: erp-engine
    app.kubernetes.io/component: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: erp-engine
  template:
    metadata:
      labels:
        app: erp-engine
    spec:
      containers:
        - name: erp-engine
          image: ghcr.io/alaminsohagofficial/-business-erp-engine:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - secretRef:
                name: erp-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: erp-engine-service
  namespace: erp-engine
  labels:
    app.kubernetes.io/name: erp-engine
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP
      name: http
  selector:
    app: erp-engine
