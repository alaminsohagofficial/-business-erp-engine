name: Salsabilah Background Automation

on:
  schedule:
    # Runs at 00:00, 06:00, 12:00, and 18:00 UTC (06:00, 12:00, 18:00, 00:00 +06)
    - cron: '0 0,6,12,18 * * *'
  workflow_dispatch:

concurrency:
  group: salsabilah-background-automation
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run-automation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash

    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      BANK_API_ENDPOINT: ${{ secrets.BANK_API_ENDPOINT }}
      BANK_API_TOKEN: ${{ secrets.BANK_API_TOKEN }}
      LEDGER_API_URL: ${{ secrets.LEDGER_API_URL }}
      API_TOKEN: ${{ secrets.API_TOKEN }}
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: "."

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Worker
        timeout-minutes: 15
        run: |
          set -euo pipefail
          python worker.py

      - name: Run Ledger Sync
        timeout-minutes: 15
        run: |
          set -euo pipefail
          python api/ledger_sync.py
