name: Salsabilah Background Automation

on:
  schedule:
    - cron: '0 0,6,12,18 * * *'
  workflow_dispatch:

jobs:
  run-automation:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      BANK_API_ENDPOINT: ${{ secrets.BANK_API_ENDPOINT }}
      BANK_API_TOKEN: ${{ secrets.BANK_API_TOKEN }}
      LEDGER_API_URL: ${{ secrets.LEDGER_API_URL }}
      API_TOKEN: ${{ secrets.API_TOKEN }}
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: "."

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          set -e
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "No requirements.txt found, skipping dependency install."
          fi

      - name: Run Worker
        run: |
          set -e
          python worker.py

      - name: Run Ledger Sync
        run: |
          set -e
          python api/ledger_sync.py
