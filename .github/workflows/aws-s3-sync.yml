name: Deploy ERP Engine CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm' # Caches npm dependencies to speed up future runs

      - name: Install Dependencies
        run: npm ci

      # Checks JavaScript syntax / bugs before deploying to Render
      - name: Verify Code Syntax
        run: node --check server.js

      # Validates Dockerfile build integrity locally in CI
      - name: Test Docker Build
        run: docker build -t erp-engine:test .
