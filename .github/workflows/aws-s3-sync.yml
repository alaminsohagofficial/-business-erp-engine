name: Direct AWS S3 PDF Synchronization

on:
  push:
    branches:
      - main

jobs:
  deploy-ledger:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (Secure Key)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      - name: Overwrite & Push PDF to AWS S3 (Singapore)
        run: |
          # public ফোল্ডারের ফাইলটি সরাসরি আমাজন সিঙ্গাপুর সার্ভারে পুশ হবে
          aws s3 cp ./public/dealer_ledge_594016.pdf s3://vatone/dealer_ledge_594016.pdf --acl public-read
