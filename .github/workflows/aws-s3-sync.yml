name: Deploy ERP Engine CI

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        # npm install এর পরিবর্তে npm ci ব্যবহার করা বেশি নিরাপদ
        run: npm ci 
        
      # যদি আপনার প্রজেক্টটি বিল্ড করার প্রয়োজন হয়, তবে নিচের ধাপটি যুক্ত করতে পারেন
      # - name: Build Project
      #   run: npm run build
