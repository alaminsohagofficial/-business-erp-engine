name: SAIOS ERP Engine CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Verify Code Build
        run: node -e "console.log('SAIOS ERP Core Engine Verification Passed!')"

      # Optional: AI Audit Step via Gemini API
      - name: Run Gemini Code & Ledger Verification
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "$GEMINI_API_KEY" ]; then
            node -e "
              console.log('Running Gemini AI checks on ERP configuration...');
              // Call Gemini API to validate schema or script changes here
            "
          else
            echo "GEMINI_API_KEY not set. Skipping AI verification step."
          fi
