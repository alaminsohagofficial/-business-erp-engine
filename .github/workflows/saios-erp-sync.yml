name: SAIOS ERP Engine CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: saios_erp_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: saios_secret_key
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v3

      - name: Set up Node.js Environment
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Run ERP Reconciliation Audit Suite
        run: npm test --if-present

      - name: Trigger SAIOS Gemini Coordinator Webhook
        if: success()
        run: |
          curl -X POST "${{ secrets.SAIOS_API_GATEWAY_URL }}/api/v1/execute" \
            -H "Content-Type: application/json" \
            -d '{"prompt": "Deploy latest ERP Engine release & trigger partner ledger sync."}'
