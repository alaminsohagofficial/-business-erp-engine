<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Salsabilah Amin Group - Core ERP Engine</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: #0b132b;
      color: #f0f6fc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .card {
      background: #1c2541;
      border: 1px solid #3a506b;
      border-radius: 12px;
      padding: 2.5rem;
      max-width: 480px;
      width: 90%;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
    }
    h1 {
      color: #6fffe9;
      font-size: 1.6rem;
      margin-bottom: 0.5rem;
    }
    p {
      color: #8d99ae;
      font-size: 0.95rem;
      margin-bottom: 1.5rem;
    }
    .badge {
      display: inline-block;
      background: #0b525b;
      color: #5bc0be;
      padding: 0.4rem 1.2rem;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 1.5rem;
    }
    .info-list {
      text-align: left;
      background: #0b132b;
      padding: 1rem;
      border-radius: 8px;
      border: 1px solid #3a506b;
      font-size: 0.85rem;
      color: #cbd5e1;
    }
    .info-list div {
      margin-bottom: 0.4rem;
    }
    .info-list div:last-child {
      margin-bottom: 0;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Salsabilah Amin Group</h1>
    <p>Central Business ERP & Control Engine</p>
    <div class="badge">● Engine Online & Active</div>
    <div class="info-list">
      <div><strong>Status:</strong> Live</div>
      <div><strong>Control Unit:</strong> Gemini Core Architecture</div>
      <div><strong>Architecture:</strong> ERP, SAP & VAT Management</div>
    </div>
  </div>
</body>
</html>
